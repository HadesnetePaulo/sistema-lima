<!doctype html>

    <script>
      // Suppress Vite HMR WebSocket connection errors as HMR is disabled in AI Studio iframe
      (function() {
        if (typeof window !== 'undefined') {
          // Dummy WebSocket for vite-hmr to prevent failed connection errors in console
          var OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf('hmr') !== -1))) {
                return {
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  send: function() {},
                  close: function() {},
                  readyState: 3
                };
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
          }

          var drop = function(args) {
            if (!args || !args.length) return false;
            for (var i = 0; i < args.length; i++) {
              var item = String(args[i] || '');
              if (
                item.indexOf('[vite]') !== -1 ||
                item.indexOf('vite:') !== -1 ||
                item.indexOf('WebSocket') !== -1 ||
                item.indexOf('websocket') !== -1 ||
                item.indexOf('HMR') !== -1
              ) {
                return true;
              }
            }
            return false;
          };

          ['error', 'warn', 'log', 'info', 'debug'].forEach(function(m) {
            var orig = console[m];
            console[m] = function() {
              if (drop(arguments)) return;
              return orig.apply(console, arguments);
            };
          });

          window.addEventListener('error', function(event) {
            var msg = event ? (event.message || (event.error && event.error.message) || '') : '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('vite') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event ? String(event.reason || (event.reason && event.reason.message) || '') : '';
            if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('[vite]') !== -1 || reason.indexOf('vite') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);
        }
      })();

      // Garante desinstalação de qualquer Service Worker antigo em modo preview para evitar tela branca
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        }).catch(function() {});
      }
    </script>
