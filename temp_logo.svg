<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 800' width='1000' height='800'>
  <defs>
    <linearGradient id='goldBase' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#936712'/>
      <stop offset='20%' stop-color='#DDB24A'/>
      <stop offset='45%' stop-color='#FFF7C2'/>
      <stop offset='60%' stop-color='#D4A338'/>
      <stop offset='85%' stop-color='#9A6C15'/>
      <stop offset='100%' stop-color='#6C4A0B'/>
    </linearGradient>
    <linearGradient id='goldLetter' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#FFF2A6'/>
      <stop offset='25%' stop-color='#E8BA48'/>
      <stop offset='60%' stop-color='#B8831A'/>
      <stop offset='85%' stop-color='#DFB243'/>
      <stop offset='100%' stop-color='#7E540C'/>
    </linearGradient>
    <linearGradient id='diamondGlow' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#FFFFFF'/>
      <stop offset='50%' stop-color='#E0F2FE'/>
      <stop offset='100%' stop-color='#94A3B8'/>
    </linearGradient>
    <filter id='dropGlow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='6' stdDeviation='8' flood-color='#855305' flood-opacity='0.25'/>
    </filter>
  </defs>

  <!-- Pure White Background as uploaded -->
  <rect width='1000' height='800' fill='#FFFFFF'/>

  <g transform='translate(500, 240)' filter='url(#dropGlow)'>
    <!-- CROWN ARTWORK EXACT REPLICA -->
    <!-- Base arch -->
    <path d='M -220,130 C -120,150 120,150 220,130 C 210,148 110,165 0,165 C -110,165 -210,148 -220,130 Z' fill='url(#goldBase)' stroke='#7A520B' stroke-width='1.5'/>
    <path d='M -230,115 C -130,135 130,135 230,115 C 225,123 125,142 0,142 C -125,142 -225,123 -230,115 Z' fill='url(#goldBase)'/>

    <!-- Diamond gems on base band -->
    <g fill='url(#diamondGlow)' stroke='#9A6C15' stroke-width='1'>
      <circle cx='-190' cy='129' r='4.5'/>
      <circle cx='-155' cy='134' r='5'/>
      <circle cx='-120' cy='138' r='5.5'/>
      <circle cx='-85' cy='142' r='6'/>
      <circle cx='-50' cy='145' r='6.5'/>
      <circle cx='-17' cy='147' r='7'/>
      <circle cx='17' cy='147' r='7'/>
      <circle cx='50' cy='145' r='6.5'/>
      <circle cx='85' cy='142' r='6'/>
      <circle cx='120' cy='138' r='5.5'/>
      <circle cx='155' cy='134' r='5'/>
      <circle cx='190' cy='129' r='4.5'/>
    </g>

    <!-- Side Flourishes & Arches (Left & Right) -->
    <!-- Left wing -->
    <path d='M -230,115 C -265,100 -290,65 -285,35 C -280,5 -250,-10 -225,0 C -205,10 -200,35 -210,50 C -225,70 -245,75 -230,105 Z' fill='url(#goldBase)' stroke='#8A5B0B' stroke-width='1.5'/>
    <path d='M -285,35 C -305,45 -315,30 -305,10 C -295,-5 -275,5 -285,35 Z' fill='url(#goldBase)'/>
    
    <!-- Right wing -->
    <path d='M 230,115 C 265,100 290,65 285,35 C 280,5 250,-10 225,0 C 205,10 200,35 210,50 C 225,70 245,75 230,105 Z' fill='url(#goldBase)' stroke='#8A5B0B' stroke-width='1.5'/>
    <path d='M 285,35 C 305,45 315,30 305,10 C 295,-5 275,5 285,35 Z' fill='url(#goldBase)'/>

    <!-- Intermediate pinnacles -->
    <path d='M -170,110 C -190,70 -195,10 -180,-30 C -160,-20 -150,15 -145,50 C -140,80 -155,100 -170,110 Z' fill='url(#goldBase)' stroke='#8A5B0B' stroke-width='1'/>
    <circle cx='-180' cy='-33' r='9' fill='url(#diamondGlow)' stroke='#9A6C15' stroke-width='2'/>

    <path d='M 170,110 C 190,70 195,10 180,-30 C 160,-20 150,15 145,50 C 140,80 155,100 170,110 Z' fill='url(#goldBase)' stroke='#8A5B0B' stroke-width='1'/>
    <circle cx='180' cy='-33' r='9' fill='url(#diamondGlow)' stroke='#9A6C15' stroke-width='2'/>

    <!-- Mid pinnacles with curls -->
    <path d='M -105,115 C -125,50 -120,-10 -90,-60 C -70,-50 -70,0 -80,45 C -85,85 -95,105 -105,115 Z' fill='url(#goldBase)' stroke='#8A5B0B' stroke-width='1'/>
    <circle cx='-90' cy='-63' r='10' fill='url(#diamondGlow)' stroke='#9A6C15' stroke-width='2'/>

    <path d='M 105,115 C 125,50 120,-10 90,-60 C 70,-50 70,0 80,45 C 85,85 95,105 105,115 Z' fill='url(#goldBase)' stroke='#8A5B0B' stroke-width='1'/>
    <circle cx='90' cy='-63' r='10' fill='url(#diamondGlow)' stroke='#9A6C15' stroke-width='2'/>

    <!-- Central Grand Fleur-de-lis Crest -->
    <path d='M 0,-135 C -18,-95 -45,-50 -40,-15 C -35,15 -15,40 0,60 C 15,40 35,15 40,-15 C 45,-50 18,-95 0,-135 Z' fill='url(#goldBase)' stroke='#7A520B' stroke-width='1.5'/>
    
    <!-- Central diamond teardrop / oval -->
    <ellipse cx='0' cy='-15' rx='14' ry='22' fill='url(#diamondGlow)' stroke='#9A6C15' stroke-width='2.5'/>
    <ellipse cx='0' cy='-15' rx='10' ry='17' fill='none' stroke='#FFFFFF' stroke-width='1.5'/>

    <!-- Central Top Peak Cross/Diamond -->
    <circle cx='0' cy='-140' r='13' fill='url(#diamondGlow)' stroke='#9A6C15' stroke-width='2.5'/>
    <path d='M -5,-140 L 0,-152 L 5,-140 L 0,-128 Z' fill='#FFFFFF'/>

    <!-- Surrounding filigree loops inside crown -->
    <path d='M -40,30 C -60,0 -40,-40 -20,-20 C -5,-5 -25,20 -40,30 Z' fill='url(#goldBase)'/>
    <path d='M 40,30 C 60,0 40,-40 20,-20 C 5,-5 25,20 40,30 Z' fill='url(#goldBase)'/>

    <!-- Diamond gems on curls -->
    <circle cx='-45' cy='-30' r='5' fill='url(#diamondGlow)' stroke='#9A6C15'/>
    <circle cx='45' cy='-30' r='5' fill='url(#diamondGlow)' stroke='#9A6C15'/>
    <circle cx='-135' cy='20' r='5' fill='url(#diamondGlow)' stroke='#9A6C15'/>
    <circle cx='135' cy='20' r='5' fill='url(#diamondGlow)' stroke='#9A6C15'/>
  </g>

  <!-- TYPOGRAPHY: LIMA -->
  <g filter='url(#dropGlow)'>
    <text x='500' y='520' 
      font-family='Cinzel, Playfair Display, FreeSerif, serif' 
      font-size='165' 
      font-weight='700' 
      text-anchor='middle' 
      letter-spacing='10'
      fill='url(#goldLetter)'
      stroke='#784F07'
      stroke-width='2.5'>LIMA</text>
  </g>

  <!-- SUBTITLE: SEMIJOIAS E ACESSÓRIOS -->
  <text x='500' y='585' 
    font-family='Montserrat, Plus Jakarta Sans, FreeSans, sans-serif' 
    font-size='32' 
    font-weight='600' 
    text-anchor='middle' 
    letter-spacing='18'
    fill='#9E7318'
    stroke='#845A09'
    stroke-width='0.5'>SEMIJOIAS E ACESSÓRIOS</text>
</svg>