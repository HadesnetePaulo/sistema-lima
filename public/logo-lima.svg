<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 820' width='1000' height='820'>
  <defs>
    <linearGradient id='goldCrown' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#9A6D15'/>
      <stop offset='15%' stop-color='#D9AE42'/>
      <stop offset='35%' stop-color='#FFF8C8'/>
      <stop offset='55%' stop-color='#CFA035'/>
      <stop offset='80%' stop-color='#8C6110'/>
      <stop offset='100%' stop-color='#604007'/>
    </linearGradient>
    <linearGradient id='goldCrownLight' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#FFFADB'/>
      <stop offset='30%' stop-color='#F3CD67'/>
      <stop offset='70%' stop-color='#BA8518'/>
      <stop offset='100%' stop-color='#734D09'/>
    </linearGradient>
    <linearGradient id='goldText' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#FFF5B8'/>
      <stop offset='25%' stop-color='#EBBF50'/>
      <stop offset='55%' stop-color='#A87413'/>
      <stop offset='85%' stop-color='#E6BA4A'/>
      <stop offset='100%' stop-color='#734A07'/>
    </linearGradient>
    <radialGradient id='diamondGem' cx='40%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#FFFFFF'/>
      <stop offset='35%' stop-color='#F0F9FF'/>
      <stop offset='75%' stop-color='#BAE6FD'/>
      <stop offset='100%' stop-color='#7DD3FC'/>
    </radialGradient>
    <filter id='shadowEffect' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='5' stdDeviation='7' flood-color='#694303' flood-opacity='0.22'/>
    </filter>
  </defs>

  <!-- Pure White Background as requested -->
  <rect width='1000' height='820' fill='#FFFFFF'/>

  <g transform='translate(500, 245)' filter='url(#shadowEffect)'>
    <!-- ================= ROYAL GOLD CROWN ================= -->
    <!-- Base Lower Band -->
    <path d='M -235,135 C -130,162 130,162 235,135 C 220,158 115,182 0,182 C -115,182 -220,158 -235,135 Z' fill='url(#goldCrown)' stroke='#634208' stroke-width='1.5'/>
    
    <!-- Base Upper Rim -->
    <path d='M -245,115 C -135,142 135,142 245,115 C 235,130 125,152 0,152 C -125,152 -235,130 -245,115 Z' fill='url(#goldCrownLight)' stroke='#634208' stroke-width='1'/>

    <!-- Row of Cut Diamond Crystals on the Crown Arch -->
    <g fill='url(#diamondGem)' stroke='#875C0C' stroke-width='1.5'>
      <circle cx='-205' cy='134' r='5'/>
      <circle cx='-170' cy='140' r='5.5'/>
      <circle cx='-135' cy='146' r='6'/>
      <circle cx='-100' cy='151' r='6.5'/>
      <circle cx='-65' cy='155' r='7'/>
      <circle cx='-25' cy='157' r='7.5'/>
      <circle cx='25' cy='157' r='7.5'/>
      <circle cx='65' cy='155' r='7'/>
      <circle cx='100' cy='151' r='6.5'/>
      <circle cx='135' cy='146' r='6'/>
      <circle cx='170' cy='140' r='5.5'/>
      <circle cx='205' cy='134' r='5'/>
    </g>

    <!-- Outer Symmetrical Filigree Wings (Left & Right) -->
    <!-- Left Outer Scroll -->
    <path d='M -245,115 C -285,100 -320,60 -315,20 C -310,-20 -270,-30 -240,-10 C -215,5 -210,35 -225,55 C -240,75 -260,85 -245,115 Z' fill='url(#goldCrown)' stroke='#634208' stroke-width='2'/>
    <path d='M -315,20 C -335,28 -345,10 -335,-10 C -325,-28 -300,-15 -315,20 Z' fill='url(#goldCrownLight)'/>
    <circle cx='-245' cy='-15' r='8' fill='url(#diamondGem)' stroke='#875C0C' stroke-width='2'/>

    <!-- Right Outer Scroll -->
    <path d='M 245,115 C 285,100 320,60 315,20 C 310,-20 270,-30 240,-10 C 215,5 210,35 225,55 C 240,75 260,85 245,115 Z' fill='url(#goldCrown)' stroke='#634208' stroke-width='2'/>
    <path d='M 315,20 C 335,28 345,10 335,-10 C 325,-28 300,-15 315,20 Z' fill='url(#goldCrownLight)'/>
    <circle cx='245' cy='-15' r='8' fill='url(#diamondGem)' stroke='#875C0C' stroke-width='2'/>

    <!-- Mid-Outer Peaks -->
    <path d='M -180,120 C -205,75 -215,10 -195,-35 C -170,-20 -160,20 -150,60 C -145,95 -165,115 -180,120 Z' fill='url(#goldCrownLight)' stroke='#634208' stroke-width='1.5'/>
    <circle cx='-195' cy='-40' r='10' fill='url(#diamondGem)' stroke='#875C0C' stroke-width='2'/>

    <path d='M 180,120 C 205,75 215,10 195,-35 C 170,-20 160,20 150,60 C 145,95 165,115 180,120 Z' fill='url(#goldCrownLight)' stroke='#634208' stroke-width='1.5'/>
    <circle cx='195' cy='-40' r='10' fill='url(#diamondGem)' stroke='#875C0C' stroke-width='2'/>

    <!-- Mid-Inner Grand Filigree Peaks with Swirls -->
    <path d='M -110,125 C -135,50 -130,-20 -95,-75 C -70,-60 -70,5 -80,55 C -85,100 -100,118 -110,125 Z' fill='url(#goldCrown)' stroke='#634208' stroke-width='1.5'/>
    <circle cx='-95' cy='-80' r='12' fill='url(#diamondGem)' stroke='#875C0C' stroke-width='2.5'/>

    <path d='M 110,125 C 135,50 130,-20 95,-75 C 70,-60 70,5 80,55 C 85,100 100,118 110,125 Z' fill='url(#goldCrown)' stroke='#634208' stroke-width='1.5'/>
    <circle cx='95' cy='-80' r='12' fill='url(#diamondGem)' stroke='#875C0C' stroke-width='2.5'/>

    <!-- Center Majestic Fleur-de-lis Spire -->
    <path d='M 0,-155 C -22,-110 -55,-55 -50,-15 C -45,20 -20,50 0,70 C 20,50 45,20 50,-15 C 55,-55 22,-110 0,-155 Z' fill='url(#goldCrown)' stroke='#5C3D06' stroke-width='2'/>
    
    <!-- Central Teardrop Diamond Gem -->
    <ellipse cx='0' cy='-15' rx='16' ry='25' fill='url(#diamondGem)' stroke='#875C0C' stroke-width='2.5'/>
    <ellipse cx='0' cy='-15' rx='11' ry='19' fill='none' stroke='#FFFFFF' stroke-width='1.5'/>

    <!-- Central Top Peak Crown Diamond -->
    <circle cx='0' cy='-160' r='15' fill='url(#diamondGem)' stroke='#875C0C' stroke-width='2.5'/>
    <polygon points='-6,-160 0,-172 6,-160 0,-148' fill='#FFFFFF'/>

    <!-- Inner Filigree Loops -->
    <path d='M -45,40 C -70,5 -45,-45 -20,-20 C -5,-5 -30,25 -45,40 Z' fill='url(#goldCrownLight)' stroke='#634208'/>
    <path d='M 45,40 C 70,5 45,-45 20,-20 C 5,-5 30,25 45,40 Z' fill='url(#goldCrownLight)' stroke='#634208'/>

    <!-- Embedded Diamond Gems on Inner Spirals -->
    <circle cx='-50' cy='-30' r='6' fill='url(#diamondGem)' stroke='#875C0C'/>
    <circle cx='50' cy='-30' r='6' fill='url(#diamondGem)' stroke='#875C0C'/>
    <circle cx='-145' cy='25' r='6' fill='url(#diamondGem)' stroke='#875C0C'/>
    <circle cx='145' cy='25' r='6' fill='url(#diamondGem)' stroke='#875C0C'/>
  </g>

  <!-- ================= LUXURY TYPOGRAPHY: LIMA ================= -->
  <g filter='url(#shadowEffect)'>
    <text x='500' y='545' 
      font-family='Cinzel, Trajan Pro, Georgia, serif' 
      font-size='175' 
      font-weight='bold' 
      text-anchor='middle' 
      letter-spacing='14'
      fill='url(#goldText)'
      stroke='#634106'
      stroke-width='2.5'>LIMA</text>
  </g>

  <!-- ================= SUBTITLE: SEMIJOIAS E ACESSÓRIOS ================= -->
  <text x='500' y='615' 
    font-family='Montserrat, Plus Jakarta Sans, Arial, sans-serif' 
    font-size='33' 
    font-weight='600' 
    text-anchor='middle' 
    letter-spacing='18'
    fill='#9E7318'
    stroke='#785208'
    stroke-width='0.5'>SEMIJOIAS E ACESSÓRIOS</text>
</svg>