<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#0C0A09" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Subtle concentric decorative ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-dasharray="6 8" opacity="0.4" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.6" />

  <!-- Sparkling Diamond / Gem Geometry -->
  <g transform="translate(256, 230) scale(1.15)">
    <!-- Top facets -->
    <polygon points="0,-100 46,-50 -46,-50" fill="#FEF3C7" opacity="0.9" />
    <polygon points="46,-50 110,-50 75,-100 0,-100" fill="#FDE68A" opacity="0.8" />
    <polygon points="-46,-50 -110,-50 -75,-100 0,-100" fill="#FDE68A" opacity="0.8" />
    
    <!-- Table crown edge facets -->
    <polygon points="110,-50 75,-100 0,-100" fill="#F59E0B" opacity="0.4" />
    <polygon points="-110,-50 -75,-100 0,-100" fill="#F59E0B" opacity="0.4" />

    <!-- Pavilion / Lower facets -->
    <polygon points="-110,-50 -46,-50 0,90" fill="#D97706" opacity="0.9" />
    <polygon points="110,-50 46,-50 0,90" fill="#B45309" opacity="0.9" />
    <polygon points="-46,-50 46,-50 0,90" fill="#FBBF24" opacity="0.95" />
    
    <!-- Center sparkle point -->
    <circle cx="0" cy="-50" r="4" fill="#FFFFFF" filter="url(#glow)" />
  </g>

  <!-- Star sparkles -->
  <path d="M 370 140 Q 380 155 395 160 Q 380 165 370 180 Q 360 165 345 160 Q 360 155 370 140 Z" fill="#FEF3C7" opacity="0.9" />
  <path d="M 140 330 Q 148 340 160 344 Q 148 348 140 360 Q 132 348 120 344 Q 132 340 140 330 Z" fill="#FDE68A" opacity="0.85" />

  <!-- Elegant Brand Monogram Text: LIMA -->
  <text x="256" y="420" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="8" fill="url(#gold-grad)" text-anchor="middle">
    LIMA
  </text>
  <text x="256" y="445" font-family="sans-serif" font-size="12" font-weight="500" letter-spacing="5" fill="#A8A29E" text-anchor="middle">
    SEMIJOIAS
  </text>
</svg>
